<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Empréstimos</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="icon" href="./favicon/images.jpeg" type="image/x-icon">
    <style>
        .vermelho { background-color: #f8d7da; }
        .amarelo { background-color: #fff3cd; }
        .finalizado { background-color: #d4edda; }
        .pagination a.active { font-weight: bold; }
    </style>
</head>

<body>
    <div class="cabecalho">
        <div class="referencias">
            <nav>
                <div class="inic-nav">
                    <a href="index.html" class="pagina-atual">Empréstimos</a>
                </div>
                <div class="projet-nav">
                    <a href="cadastro.html">Cadastro</a>
                </div>
            </nav>
        </div>
    </div>

    <div class="bloco">
        <div class="lista">
            <div id="mensagem"></div>
            <div class="titulo-e-pesquisa">
                <h1>Lista de Empréstimos</h1>
                <form method="GET" action="index.html" class="pesquisa-container">
                    <input type="text" name="search" placeholder="Pesquisar pelo nome do aluno">
                    <div class="botoes-container">
                        <button type="submit">Pesquisar</button>
                        <button type="reset">Limpar Pesquisa</button>
                    </div>
                </form>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Aluno</th>
                        <th>ID do Aluno</th>
                        <th>Nome do Livro</th>
                        <th>ID do Livro</th>
                        <th>Data de Início</th>
                        <th>Data de Fim</th>
                        <th>Ativo</th>
                        <th>Ações</th>
                        <th>Intervalo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="amarelo">
                        <td>1</td>
                        <td>João Silva</td>
                        <td>101</td>
                        <td>Livro A</td>
                        <td>202</td>
                        <td>2024-12-01</td>
                        <td>2024-12-20</td>
                        <td>Sim</td>
                        <td>
                            <button class="estender">Estender</button>
                            <button class="finalizar">Finalizar</button>
                        </td>
                        <td>3 dias</td>
                    </tr>
                    <tr class="vermelho">
                        <td>2</td>
                        <td>Maria Oliveira</td>
                        <td>102</td>
                        <td>Livro B</td>
                        <td>203</td>
                        <td>2024-11-01</td>
                        <td>2024-11-15</td>
                        <td>Não</td>
                        <td>
                            <button class="estender" disabled>Estender</button>
                            <button class="finalizar" disabled>Finalizar</button>
                        </td>
                        <td>-5 dias</td>
                    </tr>
                </tbody>
            </table>

            <div class="pagination">
                <a href="?page=1" class="active">1</a>
                <a href="?page=2">2</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.estender').forEach(function (button) {
                button.addEventListener('click', function () {
                    alert('Empréstimo estendido!');
                });
            });
            document.querySelectorAll('.finalizar').forEach(function (button) {
                button.addEventListener('click', function () {
                    alert('Empréstimo finalizado!');
                });
            });
        });
    </script>
</body>

</html>
